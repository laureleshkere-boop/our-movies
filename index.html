<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Наши фильмы</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран входа -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>🎬 Наши фильмы</h1>
      <input type="email" id="login-email" placeholder="Email" autocomplete="username">
      <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password">
      <button id="login-btn" class="btn btn-primary">Войти</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <!-- Основной экран -->
  <div id="app-screen" class="screen hidden">
    <header class="topbar">
      <h1>🎬 Наши фильмы</h1>
      <div class="topbar-actions">
        <button id="stats-btn" class="icon-btn" title="Статистика">📊</button>
        <button id="logout-btn" class="icon-btn" title="Выйти">⎋</button>
      </div>
    </header>

    <div class="status-toggle" id="status-toggle">
      <button class="status-opt active" data-status="watched">Просмотрено</button>
      <button class="status-opt" data-status="watchlist">📌 Watchlist</button>
    </div>

    <div class="tabs" id="type-tabs">
      <button class="tab active" data-type="all">Все</button>
      <button class="tab" data-type="movie">Фильмы</button>
      <button class="tab" data-type="series">Сериалы</button>
      <button class="tab" data-type="cartoon">Мультфильмы</button>
    </div>

    <div class="sort-row" id="sort-row">
      <select id="sort-select">
        <option value="date_desc">Дата: сначала новые</option>
        <option value="date_asc">Дата: сначала старые</option>
        <option value="rating_desc">Оценка: сначала лучшие</option>
        <option value="rating_asc">Оценка: сначала хуже</option>
        <option value="disagreement">По разногласию</option>
      </select>
    </div>

    <main id="movie-list" class="movie-list"></main>

    <button id="add-movie-fab" class="fab" title="Добавить фильм">+</button>
  </div>

  <!-- Модалка добавления/редактирования фильма (название, дата, постер) -->
  <div id="movie-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="movie-modal-title">Новый фильм</h2>
      <input type="text" id="movie-title-input" placeholder="Название">

      <div class="type-select" id="movie-status-select">
        <button type="button" class="type-opt active" data-status="watched">✅ Просмотрено</button>
        <button type="button" class="type-opt" data-status="watchlist">📌 В планах</button>
      </div>

      <div class="type-select" id="movie-type-select">
        <button type="button" class="type-opt active" data-type="movie">🎬 Фильм</button>
        <button type="button" class="type-opt" data-type="series">📺 Сериал</button>
        <button type="button" class="type-opt" data-type="cartoon">🧸 Мультфильм</button>
      </div>

      <div class="picker-label">Кто выбрал фильм</div>
      <div class="type-select" id="movie-picker-select"></div>

      <div class="poster-url-row">
        <input type="text" id="poster-url-input" placeholder="Ссылка на постер (необязательно)">
        <button type="button" id="fetch-poster-btn" class="btn btn-secondary">OMDb</button>
      </div>
      <div id="poster-preview"></div>

      <div id="date-field-wrap">
        <input type="date" id="movie-date-input">
      </div>
      <div class="modal-actions">
        <button id="movie-cancel-btn" class="btn btn-ghost">Отмена</button>
        <button id="movie-save-btn" class="btn btn-primary">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка оценки/комментария -->
  <div id="rating-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Твоя оценка</h2>
      <div class="rating-input-row">
        <input type="number" id="rating-score-input" min="0" max="10" step="0.5" placeholder="0-10">
      </div>
      <textarea id="rating-comment-input" placeholder="Комментарий (необязательно)" rows="3"></textarea>
      <div class="modal-actions">
        <button id="rating-cancel-btn" class="btn btn-ghost">Отмена</button>
        <button id="rating-save-btn" class="btn btn-primary">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка статистики -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Статистика</h2>
      <div id="stats-body"></div>
      <div class="modal-actions">
        <button id="stats-close-btn" class="btn btn-primary">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module" src="app.js"></script>
</body>
</html>
